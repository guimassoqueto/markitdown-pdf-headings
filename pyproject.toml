[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "markitdown-pdf-headings"
version = "0.1.0"
description = "MarkItDown plugin: PDF to Markdown with headings recovered from font size/weight and PDF bookmarks"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["markitdown[pdf]>=0.1.0", "pdfplumber>=0.11"]

[project.urls]
Homepage = "https://github.com/guimassoqueto/markitdown-pdf-headings"

[project.entry-points."markitdown.plugin"]
pdf_headings = "markitdown_pdf_headings"

[tool.hatch.build.targets.wheel]
packages = ["src/markitdown_pdf_headings"]
